<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a86b" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="url(#bgGrad)" />
  <rect width="960" height="600" fill="url(#gridPattern)" />

  <!-- Accent top bar -->
  <rect x="0" y="0" width="960" height="6" fill="url(#accentGrad)" />

  <!-- Soft glow orb -->
  <circle cx="800" cy="160" r="180" fill="#0066ff" opacity="0.12" filter="blur(50px)" />
  <circle cx="160" cy="460" r="140" fill="#00a86b" opacity="0.10" filter="blur(40px)" />

  <!-- Center Card Frame -->
  <rect x="80" y="80" width="800" height="440" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Tag Pill -->
  <g transform="translate(130, 140)">
    <rect width="160" height="34" rx="17" fill="rgba(0, 102, 255, 0.2)" stroke="rgba(0, 102, 255, 0.4)" stroke-width="1" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="1">Safety</text>
  </g>

  <!-- Logo Icon: Square with 4 squares -->
  <g transform="translate(730, 130)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <rect x="10" y="10" width="14" height="14" rx="3" fill="#00a86b" />
    <rect x="32" y="10" width="14" height="14" rx="3" fill="#0080df" />
    <rect x="10" y="32" width="14" height="14" rx="3" fill="#0080df" />
    <rect x="32" y="32" width="14" height="14" rx="3" fill="#0066ff" />
  </g>

  <!-- Main Title -->
  <text x="130" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Filtri di Contenuto</text>

  <!-- Subtitle -->
  <text x="130" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Guardrails di moderazione scolastica</text>

  <!-- CSI / Avogadro Footer metadata inside card -->
  <line x1="130" y1="390" x2="830" y2="390" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <text x="130" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="0.5">CSI PIEMONTE · IIS AMEDEO AVOGADRO</text>
  <text x="830" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="end">Progetto GustAvo · 5CI</text>
</svg>
