<!DOCTYPE html>
<html lang="it" class="chatbot-page-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chatbot GustAvo — IIS Avogadro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/favicon.png?v=2">
    <link rel="apple-touch-icon" href="assets/img/favicon.png?v=2">
    <link rel="manifest" href="manifest.json">

    <!-- Meta Tag Condivisione Social & Chat (Senza immagine, solo testo ufficiale) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GustAvo · IIS Avogadro">
    <meta property="og:title" content="GustAvo">
    <meta property="og:description" content="GustAvo, Il chatbot che ti orienta a scuola · IIS Avogadro">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="GustAvo">
    <meta name="twitter:description" content="GustAvo, Il chatbot che ti orienta a scuola · IIS Avogadro">

    <link rel="stylesheet" href="assets/css/style.css?v=4.28">
    <script src="assets/js/main.js?v=4.20" defer></script>
    <script src="assets/js/intents-data.js?v=6.5" defer></script>
    <script src="assets/js/chatbot-theme-inject.js?v=6.5" defer></script>
    <style>
        .nav-logo-gustavo-full {
            height: 40px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.25));
            transition: transform 0.2s ease;
        }
        .nav-logo-gustavo-full:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .nav-logo-gustavo-full {
                height: 32px;
                max-width: 110px;
            }
        }
        /* Regole di sicurezza viewport mobile e overlay menu hamburger */
        html.chatbot-page-html,
        body.chatbot-page {
            height: 100%;
            height: -webkit-fill-available;
            height: 100dvh;
            min-height: 0 !important;
            max-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .nav-mobile {
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            z-index: 1006 !important;
            box-shadow: 0 14px 28px rgba(0, 30, 80, 0.25) !important;
        }
        .chatbot-direct-bar {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            flex-shrink: 0 !important;
        }
        .chatbot-direct-bar .chatbot-bar-note {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .chatbot-iframe[data-theme-injected="true"] {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            transform: none !important;
        }
        .chatbot-ui-switch-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .chatbot-toggle-pill {
            display: inline-flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 2px;
            gap: 2px;
        }
        .pill-btn {
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 0.74rem;
            font-weight: 600;
            font-family: inherit;
            padding: 4px 10px;
            border-radius: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            user-select: none;
            line-height: 1.2;
        }
        .pill-btn:hover:not(.active) {
            color: #0f172a;
            background: rgba(0, 0, 0, 0.04);
        }
        .pill-btn.active {
            background: linear-gradient(135deg, #00a86b 0%, #0066ff 100%);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 102, 255, 0.28);
        }
        .pill-btn .pill-icon {
            display: inline-block;
            vertical-align: middle;
        }
        .chatbot-direct-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Disattivazione completa del widget accessibilità nella scheda del chatbot */
        .chatbot-page .g-a11y-btn,
        .chatbot-page .g-a11y-panel,
        .chatbot-page .g-a11y-backdrop,
        .chatbot-page #a11yTtsReadingBox,
        .chatbot-page .g-guide-line,
        .chatbot-page .back-to-top-btn {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        @media (max-width: 768px) {
            .chatbot-direct-bar {
                padding: 6px 12px !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                gap: 8px !important;
            }
            .chatbot-direct-bar .chatbot-bar-note {
                display: none !important;
            }
            .chatbot-direct-info a {
                font-size: 0.74rem !important;
                white-space: nowrap !important;
            }
            .pill-btn {
                padding: 4px 10px !important;
                font-size: 0.72rem !important;
            }
        }

        /* Layout ordinato e pulito per schermi stretti (< 390px) */
        @media (max-width: 390px) {
            .chatbot-direct-bar {
                padding: 6px 10px !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 5px !important;
                text-align: center !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
            .chatbot-ui-switch-wrapper {
                justify-content: center !important;
                width: 100% !important;
            }
            .chatbot-direct-info {
                justify-content: center !important;
                width: 100% !important;
                text-align: center !important;
            }
            .chatbot-direct-info a {
                font-size: 0.72rem !important;
                line-height: 1.3 !important;
            }
            .pill-btn {
                padding: 3px 9px !important;
                font-size: 0.70rem !important;
            }
        }
    </style>
</head>
<body class="chatbot-page">

    <!-- NAVBAR UFFICIALE GUSTAVO -->
    <header>
        <nav class="navbar">
            <div class="nav-brand-group">
                <div class="nav-brand-logos" aria-label="Loghi IIS Avogadro e CSI Piemonte">
                    <a href="https://www.itisavogadro.it/" target="_blank" rel="noopener noreferrer" class="nav-logo-link" title="Istituto Tecnico Amedeo Avogadro — Torino">
                        <img src="assets/img/logo_avogadro.png" alt="Logo IIS Avogadro" class="nav-logo-avo">
                    </a>
                    <span class="nav-logo-divider" aria-hidden="true"></span>
                    <a href="https://www.csipiemonte.it/it" target="_blank" rel="noopener noreferrer" class="nav-logo-link" title="CSI Piemonte">
                        <img src="assets/img/logo_csi_piemonte.png" alt="Logo CSI Piemonte" class="nav-logo-csi">
                    </a>
                </div>
                <span class="nav-brand-divider" aria-hidden="true"></span>
                <a href="index.html" class="logo-link" title="GustAvo — Home">
                    <img src="assets/img/gustavo_icon.png" alt="Logo GustAvo" class="nav-logo-gustavo-full">
                </a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="progetto.html">Progetto</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="documentazione.html">Documentazione</a></li>
                <li><a href="chatbot.html" class="active">Chatbot</a></li>
                <li><a href="galleria.html">Galleria</a></li>
            </ul>

            <button class="hamburger" id="hamburger" aria-label="Menu di navigazione" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </nav>

        <!-- MENU MOBILE TOUCH-FRIENDLY -->
        <nav class="nav-mobile" id="navMobile" aria-hidden="true">
            <a href="index.html">Home</a>
            <a href="progetto.html">Progetto</a>
            <a href="team.html">Team</a>
            <a href="documentazione.html">Documentazione</a>
            <a href="chatbot.html" class="active">Chatbot</a>
            <a href="galleria.html">Galleria</a>
        </nav>
    </header>

    <!-- MAIN CHATBOT WORKSPACE -->
    <main class="chatbot-main" id="main">
        <h1 class="sr-only">Chatbot GustAvo — Assistente virtuale scolastico</h1>
        <div class="chatbot-iframe-box">
            <iframe
                src="https://gustavo1.avoprogetti.it"
                class="chatbot-iframe"
                title="Chatbot GustAvo — Server Ufficiale gustavo1.avoprogetti.it"
                allow="microphone; autoplay"
                scrolling="no"
                loading="eager">
            </iframe>
        </div>

        <!-- BARRA INFORMATIVA SERVER E SELEZIONE UI -->
        <div class="chatbot-direct-bar">
            <div class="chatbot-ui-switch-wrapper">
                <span class="chatbot-bar-note">Interfaccia:</span>
                <div class="chatbot-toggle-pill" role="radiogroup" aria-label="Selettore versione interfaccia">
                    <button type="button" class="pill-btn active" id="btnUiModern" aria-checked="true" role="radio" title="Passa all'interfaccia moderna personalizzata">
                        <svg class="pill-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 3v18"/><path d="M14 9h4"/><path d="M14 15h4"/></svg>
                        <span>UI Moderna</span>
                    </button>
                    <button type="button" class="pill-btn" id="btnUiLegacy" aria-checked="false" role="radio" title="Passa all'interfaccia originale legacy">
                        <svg class="pill-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                        <span>UI Legacy</span>
                    </button>
                </div>
            </div>
            <div class="chatbot-direct-info">
                <span class="chatbot-bar-note">Chatbot hostato sul server della scuola:</span>
                <a href="https://gustavo1.avoprogetti.it" target="_blank" rel="noopener">Apri direttamente gustavo1.avoprogetti.it ↗</a>
            </div>
        </div>
    </main>

</body>
</html>
