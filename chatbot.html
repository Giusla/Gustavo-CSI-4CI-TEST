<!DOCTYPE html>

    <style>
        /* Regole di sicurezza viewport mobile e overlay menu hamburger */
        html.chatbot-page-html,
        body.chatbot-page {
            height: 100%;
            height: -webkit-fill-available;
            height: 100dvh;
            min-height: 0 !important;
            max-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .nav-mobile {
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            z-index: 1001 !important;
            box-shadow: 0 14px 28px rgba(0, 30, 80, 0.25) !important;
        }
        .chatbot-direct-bar {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            flex-shrink: 0 !important;
        }
        .chatbot-direct-bar .chatbot-bar-note {
            display: inline-block !important;
            visibility: visible !important;

                <span class="nav-brand-divider" aria-hidden="true"></span>

            <ul class="nav-links">

        <nav class="nav-mobile" id="navMobile" aria-hidden="true">
            <a href="index.html">Home</a>
            <a href="progetto.html">Progetto</a>
            <a href="team.html">Team</a>

    <main class="chatbot-main">
        <div class="chatbot-iframe-box">
            <iframe

                class="chatbot-iframe"
                title="Chatbot GustAvo — Server Ufficiale gustavo1.avoprogetti.it"
                allow="microphone"
                loading="lazy">

        </div>

        <div class="chatbot-direct-bar">
